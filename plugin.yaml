description: "Fish Audio text-to-speech backend for Hermes. Registers a 'fishaudio' TTS provider that synthesizes speech via POST https://api.fish.audio/v1/tts using the s2.1-pro-free developer tier. Strips fenced/inline code blocks and markdown noise before synthesis so technical replies are not read verbatim, which also keeps latency down on code-heavy answers."
