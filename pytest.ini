[pytest]
testpaths = tests
addopts = -q --import-mode=importlib
# Identifier-name constraint: pytest resolves test packages by walking up
# __init__.py-marked directories and requires every one to be a valid Python
# identifier. Local checkouts are named `fishaudio` (valid), but GitHub
# checks out `hermes-plugin-fishaudio-tts` (hyphens), where pytest falls back
# to importing the root __init__.py as a top-level module and every relative
# import dies at collection. The root __init__.py itself is required at
# runtime (Hermes loads the plugin through it), so the fix is ci.yml checking
# out into `plugin/`, not deleting the file.
pythonpath = .
