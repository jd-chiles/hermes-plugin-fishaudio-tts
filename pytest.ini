[pytest]
testpaths = tests
addopts = -q --import-mode=importlib
# importlib mode: pytest must not derive package names from this repo's
# checkout directory name. Local checkouts are named `fishaudio` (a valid
# Python identifier) but GitHub checks out `hermes-plugin-fishaudio-tts`
# (hyphens), where prepend mode imports the root __init__.py as a top-level
# module and every relative import dies at collection. The root __init__.py
# itself is required at runtime (Hermes loads the plugin through it), so the
# fix is the import mode, not deleting the file.
pythonpath = .
